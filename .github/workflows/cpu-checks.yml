name: CPU framework checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[test]'
      - run: python -m attacker_cli check
      - run: python -m attacker_cli batch --manifest examples/tasks.json
      - run: python -m pytest -q
      - run: python -m scripts.demo --runs-root outputs/ci_protocol_demo --all
